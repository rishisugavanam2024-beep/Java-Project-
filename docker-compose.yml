services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: resolvebid
      MYSQL_USER: resolvebid
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: 8090
      DB_URL: jdbc:mysql://db:3306/resolvebid?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: resolvebid
      DB_PASSWORD: ${MYSQL_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    ports:
      - "8090:8090"
    volumes:
      - app_data:/app/data

volumes:
  mysql_data:
  app_data:
